[project]
name = "article-craft"
version = "2.1.0"
description = "An AI editorial workflow for writing better articles. Helps writers research, structure, review, fact-check, improve, and prepare articles for publishing."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Article Craft contributors" }]
requires-python = ">=3.11"
keywords = [
    "writing",
    "editorial",
    "medium",
    "agent-skills",
    "ai",
    "technical-writing",
    "blogging",
    "devto",
    "hashnode",
    "substack",
    "linkedin",
    "fact-checking",
    "plagiarism",
    "writing-tools",
    "claude-code",
    "mcp",
    "mcp-server",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Topic :: Software Development :: Documentation",
]
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML",
]
mcp = [
    "mcp>=1.2",
]

[project.scripts]
article-craft = "article_craft.cli.main:app"
article-craft-mcp = "article_craft.mcp.server:main"

[project.urls]
Homepage = "https://github.com/TharunKumarReddyPolu/article-craft"
Documentation = "https://github.com/TharunKumarReddyPolu/article-craft/tree/main/docs"
Issues = "https://github.com/TharunKumarReddyPolu/article-craft/issues"
Changelog = "https://github.com/TharunKumarReddyPolu/article-craft/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/article_craft"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# B008 (function calls in argument defaults) is Typer's standard idiom for
# declaring CLI options.
"src/article_craft/cli/**" = ["B008"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
explicit_package_bases = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# The MCP server is an optional extra (article-craft[mcp]); CI type-checks
# without the mcp SDK installed, so its imports are ignored everywhere.
[[tool.mypy.overrides]]
module = "mcp.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integration: end-to-end CLI tests (may be slower)",
]
