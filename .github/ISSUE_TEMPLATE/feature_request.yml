name: Feature request
description: Suggest an improvement — a workflow, adapter, or check.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The friction you hit
      description: What were you trying to do, and what got in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you'd like
      description: Keep the project's philosophy in mind (no auto-publishing, no distribution prediction, author stays the author).
    validations:
      required: true
  - type: checkboxes
    id: philosophy
    attributes:
      label: Philosophy check
      options:
        - label: This fits the project's goals (editorial assistant, not content generator)
          required: true
