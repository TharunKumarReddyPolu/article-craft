version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # One PR per weekly bump cycle for all lockfile-only dev/runtime
      # dependency updates, instead of ~3 separate PRs nobody merges until
      # they pile up and get closed stale (see PRs #4-#9 history).
      uv-dependencies:
        applies-to: version-updates
        dependency-type: "all"
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # Action bumps are low-risk and have no reason to arrive one per PR.
      github-actions:
        applies-to: version-updates
        dependency-type: "all"
        update-types:
          - "major"
          - "minor"
          - "patch"
